[tox]
skipsdist = True
envlist =
    py{38,39,310}-django-32
    py{38,39,310}-django-40
    py{38,39,310,311}-django-41
    py{38,39,310,311,312}-django-42
    py{310,311,312}-django-50
    py{310,311,312,313}-django-51
    py{310,311,312,313,314}-django-52
    py{312,313,314}-django-{60,61}
    py310-flake8

[testenv]
setenv =
    PYTHONPATH = {toxinidir}:{toxinidir}
deps =
    -rdjango_resized/tests/requirements.txt
    py310-flake8: flake8
    django-32: Django>=3.2,<4.0
    django-40: Django>=4.0,<4.1
    django-41: Django>=4.1,<4.2
    django-42: Django>=4.2,<4.3
    django-50: Django>=5.0,<5.1
    django-51: Django>=5.1,<5.2
    django-52: Django>=5.2,<5.3
    django-60: Django>=6.0,<6.1
    django-61: Django>=6.1,<6.2
commands =
    flake8: flake8 django_resized --ignore=E501,W504
    django: django-admin test --settings=django_resized.tests.settings {posargs}
